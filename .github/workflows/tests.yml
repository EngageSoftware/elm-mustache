name: "Run Tests"
on:
  push:

jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - name: "Install pnpm and Node.js"
        uses: "pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024" # v3.0.0
      - name: "Run Tests"
        pwsh: "pnpm run test"
